name: Prepare and Build

on:
  workflow_call:
    inputs:
      config_file:
        description: "Path to the JSON config file"
        required: true
        type: string
      os_patch_level_filter:
        description: "Optional OS patch level filter (e.g. 2023-09). Empty = include all dates"
        required: false
        type: string
        default: ""
      feature_set:
        description: "Feature Set"
        required: false
        type: string
      runner_label:
        description: "Runner label for build job (empty = GitHub-hosted ubuntu-latest)"
        required: false
        type: string
        default: ""
      quick_mode:
        description: "Quick mode: skip heavy pre-steps and bypass build"
        required: false
        type: string
        default: "false"
      susfs_commit:
        description: "SUSFS commit hash (empty = ee023e3 if present on the gki branch, else tip)"
        required: false
        type: string
        default: ""
      use_kpm:
        description: "Enable KPM (CONFIG_KPM + patch_linux). Requires SukiSU."
        required: false
        type: string
        default: "true"
      kpm_patch_ver:
        description: "SukiSU_KernelPatch_patch release (latest = newest GitHub release)"
        required: false
        type: string
        default: "latest"
      kpm_patch_linux_path:
        description: "Prebuilt patch_linux path (empty = auto-detect ~/Projects/PxGKI/KernelPatch_patch/patch_linux)"
        required: false
        type: string
        default: ""

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.final.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Config and Build Final Matrix
        id: final
        shell: bash
        run: |
          if [ ! -f "${{ inputs.config_file }}" ]; then
            echo "Error: Config file not found: ${{ inputs.config_file }}"
            exit 1
          fi

          CONFIG_JSON=$(cat "${{ inputs.config_file }}" | jq -c .)
          PATCH_FILTER="${{ inputs.os_patch_level_filter }}"

          # Build { "include": [ {android_version:..., kernel_version:..., sublevel:..., os_patch_level:..., variant: ...}, ... ] }
          # Always include Normal, and add any explicit per-item variant from the config.
          FINAL=$(jq -cn \
            --argjson cfg "$CONFIG_JSON" \
            --arg patch_filter "$PATCH_FILTER" '
            ($cfg.version | split("-")) as $version_parts
            | {
              include: (
                [
                  $cfg.include[] as $item
                  | select(($patch_filter == "") or ($item.date == $patch_filter))
                  | {
                      version: $cfg.version,
                      android_version: $version_parts[0],
                      kernel_version: $version_parts[1],
                      sublevel: $item.sublevel,
                      os_patch_level: $item.date,
                      variant: "Normal"
                    }
                ]
                + [
                  $cfg.include[] as $item
                  | select(($patch_filter == "") or ($item.date == $patch_filter))
                  | select($item.variant != null)
                  | {
                      version: $cfg.version,
                      android_version: $version_parts[0],
                      kernel_version: $version_parts[1],
                      sublevel: $item.sublevel,
                      os_patch_level: $item.date,
                      variant: $item.variant
                    }
                ]
                | unique_by([.android_version, .kernel_version, .sublevel, .os_patch_level, .variant])
              )
            }')

          if [ "$(echo "$FINAL" | jq '.include | length')" -eq 0 ]; then
            echo "Error: no matrix entries matched os_patch_level_filter='${PATCH_FILTER}' for config '${{ inputs.config_file }}'"
            exit 1
          fi

          echo "matrix=$FINAL" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.version }}
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      sublevel: ${{ matrix.sublevel }}
      os_patch_level: ${{ matrix.os_patch_level }}
      variant: ${{ matrix.variant }}
      feature_set: ${{ inputs.feature_set }}
      runner_label: ${{ inputs.runner_label }}
      quick_mode: ${{ inputs.quick_mode }}
      susfs_commit: ${{ inputs.susfs_commit }}
      use_kpm: ${{ inputs.use_kpm }}
      kpm_patch_ver: ${{ inputs.kpm_patch_ver }}
      kpm_patch_linux_path: ${{ inputs.kpm_patch_linux_path }}
    secrets: inherit
