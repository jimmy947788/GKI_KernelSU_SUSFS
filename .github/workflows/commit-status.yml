name: Commit Status Report

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build commit summary
        shell: bash
        run: |
          set -euo pipefail

          summary_file="$GITHUB_STEP_SUMMARY"

          sanitize_cell() {
            local value="$1"
            value="${value//$'\r'/ }"
            value="${value//$'\n'/ }"
            value="${value//|/\\|}"
            printf '%s' "$value"
          }

          gitlab_latest_commit() {
            local branch="$1"
            curl -fsSL "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/commits?ref_name=${branch}&per_page=1" | jq -r '.[0].id'
          }

          gitlab_latest_message() {
            local branch="$1"
            curl -fsSL "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/commits?ref_name=${branch}&per_page=1" | jq -r '.[0].message | split("\n")[0]'
          }

          github_sukisu_commit() {
            curl -fsSL "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits/6c13a06" | jq -r '.sha'
          }

          github_sukisu_message() {
            curl -fsSL "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/commits/6c13a06" | jq -r '.commit.message | split("\n")[0]'
          }

          {
            echo "# Commit Status Report"
            echo ""
            echo "Pinned SukiSU driver (6c13a06) vs latest upstream SUSFS branch tips."
            echo ""
          } >> "$summary_file"

          {
            echo "## SUSFS"
            echo ""
            echo "| Branch | Latest Commit | Latest Message |"
            echo "| --- | --- | --- |"
          } >> "$summary_file"

          SUSFS_BRANCHES=(
            "gki-android12-5.10"
            "gki-android13-5.10"
            "gki-android13-5.15"
            "gki-android14-5.15"
            "gki-android14-6.1"
            "gki-android15-6.6"
            "gki-android16-6.12"
          )

          for branch in "${SUSFS_BRANCHES[@]}"; do
            latest_commit="$(gitlab_latest_commit "$branch")"
            latest_message="$(gitlab_latest_message "$branch")"
            latest_message="$(sanitize_cell "$latest_message")"
            printf '| %s | %s | %s |\n' "$branch" "$latest_commit" "$latest_message" >> "$summary_file"
          done

          {
            echo ""
            echo "## SukiSU Ultra (pinned build driver)"
            echo ""
            echo "| Ref | Commit | Latest Message |"
            echo "| --- | --- | --- |"
          } >> "$summary_file"

          sukisu_commit="$(github_sukisu_commit)"
          sukisu_message="$(github_sukisu_message)"
          sukisu_message="$(sanitize_cell "$sukisu_message")"

          printf '| %s | %s | %s |\n' "builtin@6c13a06" "$sukisu_commit" "$sukisu_message" >> "$summary_file"
