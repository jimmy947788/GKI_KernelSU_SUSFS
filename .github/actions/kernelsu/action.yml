name: Setup Wild KSU
description: Download and configure Wild KSU with version tracking
inputs:
  ksu_branch:
    description: >
      KernelSU branch or commit (empty is not used here — the default path is SukiSU).
      Prefix "sukisu:" is handled by the sukisu action instead. This action is the
      KernelSU-Next escape hatch when ksu_branch is a Next ref such as "dev-susfs".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download Wild KSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_INPUT="${{ inputs.ksu_branch }}"

        if [[ "$KSU_INPUT" == sukisu:* ]]; then
          # ── SukiSU-Ultra mode ────────────────────────────────────────────────
          SUKISU_REF="${KSU_INPUT#sukisu:}"
          if [ -z "$SUKISU_REF" ]; then
            SUKISU_REF="main"
          fi
          SUKISU_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"

          echo "Using SukiSU-Ultra source: $SUKISU_REF"
          git clone --filter=blob:none --no-checkout "$SUKISU_REPO" SukiSU-Ultra
          cd SukiSU-Ultra
          git fetch --depth=100 origin "$SUKISU_REF" 2>/dev/null || \
            git fetch --unshallow origin "$SUKISU_REF"
          git checkout FETCH_HEAD
          cd ..

          # Wire the kernel/ subdir into the drivers directory (mirrors setup.sh behaviour)
          if [ -d "common/drivers" ]; then
            DRIVER_DIR="common/drivers"
          elif [ -d "drivers" ]; then
            DRIVER_DIR="drivers"
          else
            echo "[ERROR] drivers/ directory not found"; exit 1
          fi

          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$(pwd)/SukiSU-Ultra/kernel")" \
            "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || \
            printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q 'drivers/kernelsu/Kconfig' "$DRIVER_DIR/Kconfig" || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"

          # Version = 30000 + total commit count in the SukiSU-Ultra repo
          cd SukiSU-Ultra
          COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
          BASE_VERSION=30000
          KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
          KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
          cd kernel
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild
          sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild

        else
          # ── KernelSU-Next mode (original) ────────────────────────────────────
          KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
          if [ -z "$KSU_INPUT" ]; then
            KSU_INPUT="dev-susfs"
          fi

          # Try as branch first, fall back to commit
          if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
            echo "Using KernelSU-Next branch: $KSU_INPUT"
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
            git -C KernelSU-Next/kernel checkout "origin/$KSU_INPUT"
          else
            echo "Using KernelSU-Next commit: $KSU_INPUT"
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
            git -C KernelSU-Next/kernel checkout "$KSU_INPUT"
          fi

          cd KernelSU-Next/kernel

          COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
          BASE_VERSION=30000
          KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild

          KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
          sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild
        fi

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        KSU_INPUT="${{ inputs.ksu_branch }}"

        if [[ "$KSU_INPUT" == sukisu:* ]]; then
          cd SukiSU-Ultra
          KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null)
          KSU_GIT_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
          KSU_VERSION=$((30000 + KSU_GIT_VERSION))
        else
          cd KernelSU-Next
          BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD | sed 's:-.*::' 2>/dev/null)
          BASE_COMMIT=$(git merge-base HEAD refs/remotes/origin/$BASE_BRANCH 2>/dev/null || \
                        git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
          KSU_GIT_VERSION=$(git rev-list --count $BASE_COMMIT 2>/dev/null)
          KSU_GIT_TAG=$(git describe --tags --abbrev=0 $BASE_COMMIT 2>/dev/null || echo "")
          KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
          KSU_VERSION=$((30000 + KSU_GIT_VERSION))
        fi

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV

    - name: 'Fix KernelSU-Next (skip for SukiSU-Ultra)'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        KSU_INPUT="${{ inputs.ksu_branch }}"

        if [[ "$KSU_INPUT" == sukisu:* ]]; then
          # static.patch targets KernelSU-Next selinux_hide.c; SukiSU has a
          # different implementation — skip to avoid patch rejection.
          echo "Skipping static.patch for SukiSU-Ultra (not applicable)"
        else
          cd KernelSU-Next
          cp ${{ github.action_path }}/patches/static.patch static.patch
          patch -p1 < static.patch
        fi

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
