name: Set Kernel Config
description: Patch gki_defconfig directly (add or modify entries)

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
  - name: Patch kernel configs
    shell: bash
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail

      CONFIG_LIST="${{ inputs.config_list }}"
      TARGET_FILES=(
        "arch/arm64/configs/gki_defconfig"
        "arch/arm64/configs/gki.fragment"
        ".config"
      )

      apply_line() {
        local target="$1"
        local line="$2"
        line="$(echo "$line" | xargs)"

        # skip empty/comments
        [[ -z "$line" || "$line" == \#* ]] && return

        local key value
        if [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        echo "Processing: $key=$value"

        # if config exists anywhere in file → replace it
        if grep -q "^$key=" "$target"; then
          sed -i "s|^$key=.*|$key=$value|g" "$target"
        elif grep -q "^# $key is not set" "$target"; then
          sed -i "s|^# $key is not set|$key=$value|g" "$target"
        else
          echo "$key=$value" >> "$target"
        fi
      }

      for target in "${TARGET_FILES[@]}"; do
        if [ -f "$target" ]; then
          echo "Patching $target"
          while IFS= read -r line || [ -n "$line" ]; do
            apply_line "$target" "$line"
          done <<< "$CONFIG_LIST"
        fi
      done

      if [ ! -f "arch/arm64/configs/gki_defconfig" ] && [ ! -f "arch/arm64/configs/gki.fragment" ] && [ ! -f ".config" ]; then
        echo "ERROR: no supported kernel config file was found"
        exit 1
      fi