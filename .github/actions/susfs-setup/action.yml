name: 'Setup SUSFS Branch'
description: 'Clone SUSFS repo matched to the pinned SukiSU builtin era'
inputs:
  susfs_commit:
    description: 'SUSFS commit hash (empty = 2c774fdb on android13-5.10; other versions must pass a commit)'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Clone SUSFS Branch
      shell: bash
      run: |
        set -euo pipefail

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"
        echo "Cloning latest from $SUSFS_BRANCH..."
        git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

        cd ${{ github.workspace }}/susfs4ksu

        # builtin b20dee702 calls susfs_set_current_proc_no_su() and
        # susfs_set_current_proc_umounted_for_zygote_next(). Those inlines
        # exist from SUSFS v2.3.0. 2c774fdb (2026-09-13) is that generation
        # on gki-android13-5.10 only. ee023e3 (v2.1.0) does not have them.
        # Do not apply pershoot KernelSU-Next coexistence patches.
        SUSFS_COMMIT="${{ inputs.susfs_commit }}"
        if [ -z "$SUSFS_COMMIT" ]; then
          case "${{ inputs.version }}" in
            android13-5.10)
              SUSFS_COMMIT="2c774fdb"
              ;;
            *)
              echo "ERROR: ${{ inputs.version }} has no SUSFS pin for SukiSU builtin b20dee702."
              echo "android13-5.10 defaults to 2c774fdb (SUSFS v2.3.0, TIF_PROC_NO_SU)."
              echo "Pass susfs_commit for this gki branch after confirming that header."
              exit 1
              ;;
          esac
        fi
        if [ -n "$SUSFS_COMMIT" ]; then
          echo "Checking out SUSFS commit: $SUSFS_COMMIT"
          git checkout --detach "$SUSFS_COMMIT"
        fi

        echo "susfs4ksu at $(git rev-parse --short HEAD)"
