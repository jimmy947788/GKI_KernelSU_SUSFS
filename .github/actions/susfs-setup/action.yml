name: 'Setup SUSFS Branch'
description: 'Clone SUSFS repo matched to the pinned SukiSU builtin era'
inputs:
  susfs_commit:
    description: 'SUSFS commit hash (empty = use .github/config/commits.json pin for this GKI branch)'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Clone SUSFS Branch
      shell: bash
      run: |
        set -euo pipefail

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"
        echo "Cloning latest from $SUSFS_BRANCH..."
        git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

        cd ${{ github.workspace }}/susfs4ksu

        # builtin b20dee702 calls susfs_set_current_proc_no_su() and
        # susfs_set_current_proc_umounted_for_zygote_next(). Those inlines
        # exist from SUSFS v2.3.0. Keep the default pins centralized in
        # .github/config/commits.json so every GKI branch can have its own
        # validated SUSFS generation.
        # Do not apply pershoot KernelSU-Next coexistence patches.
        SUSFS_COMMIT="${{ inputs.susfs_commit }}"
        if [ -z "$SUSFS_COMMIT" ]; then
          COMMITS_JSON="${{ github.workspace }}/.github/config/commits.json"
          if [ ! -f "$COMMITS_JSON" ]; then
            echo "ERROR: default SUSFS pin file not found: $COMMITS_JSON"
            exit 1
          fi

          SUSFS_COMMIT="$(jq -r --arg branch "$SUSFS_BRANCH" '.susfs[$branch] // ""' "$COMMITS_JSON")"
          if [ -z "$SUSFS_COMMIT" ]; then
            echo "ERROR: $SUSFS_BRANCH has no SUSFS pin in $COMMITS_JSON for SukiSU builtin b20dee702."
            echo "Add a .susfs[\"$SUSFS_BRANCH\"] pin after confirming SUSFS v2.3.0+ headers, or pass susfs_commit explicitly."
            exit 1
          fi
        fi
        if [ -n "$SUSFS_COMMIT" ]; then
          echo "Checking out SUSFS commit: $SUSFS_COMMIT"
          git checkout --detach "$SUSFS_COMMIT"
        fi

        echo "susfs4ksu at $(git rev-parse --short HEAD)"
