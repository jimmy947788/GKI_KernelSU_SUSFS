name: Patch kernel Image with KPM
description: Embed KernelPatch (kpimg) into a built Image using repo-local SukiSU_KernelPatch_patch
inputs:
  image_path:
    description: 'Path to the kernel Image (or Bypass-Image) to patch in place'
    required: true

runs:
  using: composite
  steps:
    - name: Apply patch_linux
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_PATH="${{ inputs.image_path }}"
        KPM_DIR="${{ github.workspace }}/SukiSU_KernelPatch_patch"
        PATCH_LINUX="$KPM_DIR/patch_linux"
        KPIMG="$KPM_DIR/kpimg"

        if [ ! -f "$IMAGE_PATH" ]; then
          echo "ERROR: kernel image not found at $IMAGE_PATH"
          exit 1
        fi

        if [ ! -f "$PATCH_LINUX" ]; then
          echo "ERROR: patch_linux not found at $PATCH_LINUX"
          echo "Place patch_linux + kpimg from SukiSU_KernelPatch_patch release into:"
          echo "  $KPM_DIR/"
          exit 1
        fi

        echo "Using patch_linux: $PATCH_LINUX"

        IMAGE_BASE=$(basename "$IMAGE_PATH")
        WORK=$(mktemp -d)
        cp "$PATCH_LINUX" "$WORK/patch_linux"
        chmod 755 "$WORK/patch_linux"
        cp "$IMAGE_PATH" "$WORK/Image"

        if [ -f "$KPIMG" ]; then
          cp "$KPIMG" "$WORK/kpimg"
        else
          echo "WARNING: kpimg not found at $KPIMG; patch_linux may fail"
        fi

        (
          cd "$WORK"
          ./patch_linux
          if [ ! -f oImage ]; then
            echo "ERROR: patch_linux did not produce oImage"
            exit 1
          fi
        )

        mv -f "$WORK/oImage" "$IMAGE_PATH"
        rm -rf "$WORK"

        KPM_HITS=$(strings -n 6 "$IMAGE_PATH" | grep -c KernelPatch || true)
        if [ "$KPM_HITS" -eq 0 ]; then
          echo "ERROR: $IMAGE_PATH has no KernelPatch strings after patch_linux"
          exit 1
        fi

        echo "KPM embedded in $IMAGE_BASE ($KPM_HITS KernelPatch strings, $PATCH_LINUX)"
        echo "KPM_PATCH_SOURCE=$PATCH_LINUX" >> "$GITHUB_ENV"
        echo "KPM_ENABLED=true" >> "$GITHUB_ENV"
