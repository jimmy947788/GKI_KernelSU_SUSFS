name: Patch kernel Image with KPM
description: Embed KernelPatch (kpimg) into a built Image using repo-local SukiSU_KernelPatch_patch
inputs:
  image_path:
    description: 'Path to the kernel Image (or Bypass-Image) to patch in place'
    required: true

runs:
  using: composite
  steps:
    - name: Apply kptools
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_PATH="${{ inputs.image_path }}"
        KPM_DIR="${{ github.workspace }}/SukiSU_KernelPatch_patch"
        KPTOOLS="$KPM_DIR/kptools-linux"
        KPIMG="$KPM_DIR/kpimg"

        if [ ! -f "$IMAGE_PATH" ]; then
          echo "ERROR: kernel image not found at $IMAGE_PATH"
          exit 1
        fi

        if [ ! -f "$KPTOOLS" ] || [ ! -f "$KPIMG" ]; then
          echo "ERROR: kptools-linux or kpimg not found in $KPM_DIR"
          echo "Place kptools-linux + kpimg from SukiSU_KernelPatch_patch release into:"
          echo "  $KPM_DIR/"
          exit 1
        fi

        echo "Using kptools: $KPTOOLS"

        IMAGE_BASE=$(basename "$IMAGE_PATH")
        WORK=$(mktemp -d)
        cp "$KPTOOLS" "$WORK/kptools-linux"
        chmod 755 "$WORK/kptools-linux"
        cp "$KPIMG" "$WORK/kpimg"
        cp "$IMAGE_PATH" "$WORK/Image"

        # Do not use the 0.14.0 patch_linux wrapper: its embedded kpimg is a
        # single byte, it ignores the kpimg file, and it always exits 0.
        (
          cd "$WORK"
          ./kptools-linux -p -s 123 -i Image -k kpimg -o oImage
          if [ ! -f oImage ]; then
            echo "ERROR: kptools did not produce oImage"
            exit 1
          fi
        )

        mv -f "$WORK/oImage" "$IMAGE_PATH"
        rm -rf "$WORK"

        KPM_HITS=$(strings -n 6 "$IMAGE_PATH" | grep -c KernelPatch || true)
        if [ "$KPM_HITS" -eq 0 ]; then
          echo "ERROR: $IMAGE_PATH has no KernelPatch strings after kptools"
          exit 1
        fi

        echo "KPM embedded in $IMAGE_BASE ($KPM_HITS KernelPatch strings, $KPTOOLS)"
        echo "KPM_PATCH_SOURCE=$KPTOOLS" >> "$GITHUB_ENV"
        echo "KPM_ENABLED=true" >> "$GITHUB_ENV"
