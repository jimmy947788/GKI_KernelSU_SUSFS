name: Patch kernel Image with KPM
description: Embed KPatch-Next (kpimg) into a built Image using the repo-local KPatch-Next/ tools
inputs:
  image_path:
    description: 'Path to the kernel Image (or Bypass-Image) to patch in place'
    required: true

runs:
  using: composite
  steps:
    - name: Apply kptools
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_PATH="${{ inputs.image_path }}"
        KPM_DIR="${{ github.workspace }}/KPatch-Next"
        KPTOOLS="$KPM_DIR/kptools-linux"
        KPIMG="$KPM_DIR/kpimg-linux"

        if [ ! -f "$IMAGE_PATH" ]; then
          echo "ERROR: kernel image not found at $IMAGE_PATH"
          exit 1
        fi

        if [ ! -f "$KPTOOLS" ] || [ ! -f "$KPIMG" ]; then
          echo "ERROR: kptools-linux or kpimg-linux not found in $KPM_DIR"
          echo "Place kptools-linux + kpimg-linux from the KPatch-Next release into:"
          echo "  $KPM_DIR/ (see KPatch-Next/readme.md)"
          exit 1
        fi

        echo "Using kptools: $KPTOOLS"

        IMAGE_BASE=$(basename "$IMAGE_PATH")
        WORK=$(mktemp -d)
        cp "$KPTOOLS" "$WORK/kptools-linux"
        chmod 755 "$WORK/kptools-linux"
        cp "$KPIMG" "$WORK/kpimg"
        cp "$IMAGE_PATH" "$WORK/Image"

        # KPatch-Next has no superkey (kptools has no -s); the kernel only accepts
        # supercalls from uid 0.
        (
          cd "$WORK"
          ./kptools-linux -p -i Image -k kpimg -o oImage
          if [ ! -f oImage ]; then
            echo "ERROR: kptools did not produce oImage"
            exit 1
          fi
          INFO=$(./kptools-linux -l -i oImage)
          echo "$INFO" | grep -qx 'patched=true' || { echo "ERROR: oImage is not marked patched"; echo "$INFO"; exit 1; }
          KPVER=$(echo "$INFO" | sed -n 's/^version=//p' | head -1)
          echo "kpimg version in oImage: ${KPVER:-unknown}"
          echo "$KPVER" > kpver
        )
        KPVER=$(cat "$WORK/kpver")

        mv -f "$WORK/oImage" "$IMAGE_PATH"
        rm -rf "$WORK"

        KPM_HITS=$(strings -n 6 "$IMAGE_PATH" | grep -c KernelPatch || true)
        if [ "$KPM_HITS" -eq 0 ]; then
          echo "ERROR: $IMAGE_PATH has no KernelPatch strings after kptools"
          exit 1
        fi

        echo "KPM embedded in $IMAGE_BASE (KPatch-Next $KPVER, $KPM_HITS KernelPatch strings)"
        echo "KPM_PATCH_SOURCE=KPatch-Next $KPVER" >> "$GITHUB_ENV"
        echo "KPM_ENABLED=true" >> "$GITHUB_ENV"
