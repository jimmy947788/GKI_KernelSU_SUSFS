name: 'Prepare SukiSU KPM Repository'
description: 'Clone the SukiSU KernelPatch repository needed for KPM support'

inputs:
  kpm_commit:
    description: 'SukiSU KernelPatch commit (empty = pinned upstream revision)'
    required: false
    default: "c5f0785dc7fac22a846eecc6392f34198d8e18b5"

runs:
  using: "composite"
  steps:
    - name: Clone SukiSU KernelPatch
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        PATCH_REPO="${{ github.workspace }}/SukiSU_KernelPatch_patch"

        if [ -d "$PATCH_REPO" ]; then
          echo "SukiSU KernelPatch repository already exists, refreshing clone"
          rm -rf "$PATCH_REPO"
        fi

        KPM_COMMIT="${{ inputs.kpm_commit }}"
        if [ -z "$KPM_COMMIT" ]; then
          KPM_COMMIT="c5f0785dc7fac22a846eecc6392f34198d8e18b5"
        fi

        git clone https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch.git "$PATCH_REPO"
        git -C "$PATCH_REPO" checkout --detach "$KPM_COMMIT"

        if [ ! -d "$PATCH_REPO/.git" ]; then
          echo "ERROR: expected SukiSU KernelPatch checkout at $PATCH_REPO"
          exit 1
        fi

        KPM_RESOLVED_COMMIT=$(git -C "$PATCH_REPO" rev-parse HEAD)
        echo "SukiSU KPM repository available at $PATCH_REPO ($KPM_RESOLVED_COMMIT)"
        echo "SUKISU_KPM_REPO=$PATCH_REPO" >> "$GITHUB_ENV"
        echo "SUKISU_KPM_COMMIT=$KPM_RESOLVED_COMMIT" >> "$GITHUB_ENV"